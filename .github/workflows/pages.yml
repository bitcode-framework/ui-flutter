name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this package is developed and verified
          # against. The pubspec requires Dart ^3.12.0, which older stable
          # releases (e.g. 3.35.x ships Dart 3.9.2) cannot satisfy.
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        working-directory: example
        run: flutter analyze --no-fatal-infos

      - name: Test library
        run: flutter test --reporter=compact

      - name: Test demo
        working-directory: example
        run: flutter test --reporter=compact

      - name: Build web
        working-directory: example
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback + disable Jekyll
        working-directory: example/build/web
        run: |
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
